changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 📝 Documentation
      labels:
        - documentation
        - docs
    - title: 🔧 Maintenance
      labels:
        - maintenance
        - chore
        - refactor
    - title: ⚡ Performance
      labels:
        - performance
    - title: 🔒 Security
      labels:
        - security
    - title: 🎨 Style
      labels:
        - style
    - title: 🧪 Tests
      labels:
        - test
        - tests
    - title: 🏗️ Build
      labels:
        - build
        - ci
    - title: 🔄 Other Changes
      labels:
        - '*'
